<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recording Indicator Reference</title>
  </head>
  <body style="font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 24px;">
    <div style="display:inline-flex;align-items:center;gap:8px;padding:10px 12px;border-radius:9999px;background:rgba(15,23,42,0.92);box-shadow:0 12px 30px rgba(15,23,42,0.35);">
      <span style="font-weight:700;">🔴 Recording</span>
      <span>12m 34s</span>
      <span style="padding:4px 8px;border-radius:9999px;background:#ef4444;color:white;font-size:12px;">Pause</span>
    </div>
  </body>
</html>
